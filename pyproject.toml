[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "docsetmcp"
version = "0.3.3"
description = "Search local documentation from Dash through MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cody Bromley", email = "dev@codybrom.com" },
]
keywords = ["mcp", "model-context-protocol", "dash", "documentation", "llm", "docset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.4",
    "Brotli>=1.1.0",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "black>=23.12.1",
    "flake8>=7.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
    "pyright>=1.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "yamlfix>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/codybrom/docsetmcp"
"Bug Reports" = "https://github.com/codybrom/docsetmcp/issues"
Source = "https://github.com/codybrom/docsetmcp"

[project.scripts]
docsetmcp = "docsetmcp.main:main"

[tool.uv.build-backend]
module-name = "docsetmcp"
module-root = ""

[tool.yamlfix]
preserve_quotes = true
explicit_start = false
sort_keys = true
sequence_style = "block_style"
line_length = 120
section_whitelines = 0

[tool.pyright]
stubPath = "stubs"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportMissingImports = true
reportUnnecessaryCast = true
reportUntypedFunctionDecorator = "none"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "build", "dist", ".venv"]
